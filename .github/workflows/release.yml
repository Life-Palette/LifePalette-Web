name: Release

on:
  push:
    branches:
      - main

concurrency: release

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    name: Version and tag application
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create release pull request or publish tag
        uses: changesets/action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          version-script: pnpm run version
          publish-script: pnpm run release:tag
          create-github-releases: true
          push-git-tags: true
